<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KOL Brief 审核助手</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <p class="kicker">KOL REVIEW DESK</p>
        <h1>KOL Brief 审核助手</h1>
      </div>
      <div class="top-actions">
        <button id="sampleBtn" type="button">载入示例</button>
        <button id="clearBtn" type="button">清空当前项目</button>
      </div>
    </header>

    <section class="shell">
      <aside class="project-panel">
        <div class="panel-head">
          <div>
            <h2>项目</h2>
            <p>同一项目共享一份 brief，不同博主共用。</p>
          </div>
          <button id="addProjectBtn" type="button">新增项目</button>
        </div>
        <div id="projectList" class="project-list"></div>
      </aside>

      <section class="workspace">
        <div class="section-tabs" role="tablist" aria-label="审核模块">
          <button class="section-tab active" data-section="brief" type="button">Brief</button>
          <button class="section-tab" data-section="script" type="button">Script</button>
          <button class="section-tab" data-section="draft" type="button">Draft</button>
          <button class="section-tab" data-section="post" type="button">Post</button>
        </div>

        <article id="briefSection" class="section-card"></article>
        <article id="scriptSection" class="section-card hidden"></article>
        <article id="draftSection" class="section-card hidden"></article>
        <article id="postSection" class="section-card hidden"></article>

        <div class="audit-actions">
          <button id="auditBtn" class="primary" type="button">开始审核</button>
          <button id="copyBtn" type="button">复制审核结论</button>
        </div>
      </section>

      <aside class="results">
        <div class="score-card">
          <div>
            <p class="kicker">审核结论</p>
            <h2 id="verdict">待审核</h2>
          </div>
          <div class="score-ring" id="scoreRing">--</div>
        </div>

        <div id="summary" class="summary">
          录入资料后点击“开始审核”，这里会显示覆盖率、缺失要点、疑似未修改项和建议反馈话术。
        </div>

        <div class="result-controls">
          <button class="filter-btn active" data-filter="all" type="button">全部</button>
          <button class="filter-btn" data-filter="updated" type="button">已修改</button>
          <button class="filter-btn" data-filter="maybe" type="button">疑似缺失</button>
          <button class="filter-btn" data-filter="missing" type="button">未修改</button>
        </div>

        <div class="result-block">
          <h3>逐项检查</h3>
          <div id="checks" class="checks"></div>
        </div>

        <div class="result-block">
          <h3>可复制反馈</h3>
          <textarea id="feedbackOutput" readonly placeholder="审核后自动生成给博主/客户的反馈文案"></textarea>
        </div>
      </aside>
    </section>
  </main>
  <script src="./app.js"></script>
</body>
</html>
