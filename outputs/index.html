<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KOL Brief 审核助手</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <p class="kicker">KOL REVIEW DESK</p>
        <h1>KOL Brief 审核助手</h1>
      </div>
      <div class="top-actions">
        <button id="sampleBtn" type="button">载入示例</button>
        <button id="clearBtn" type="button">清空</button>
      </div>
    </header>

    <section class="mode-strip" aria-label="审核类型">
      <button class="mode-card active" type="button" data-mode="scriptBrief">
        <strong>脚本对 Brief</strong>
        <span>脚本是否拍到客户要点</span>
      </button>
      <button class="mode-card" type="button" data-mode="scriptFeedback">
        <strong>脚本改稿</strong>
        <span>二稿是否按反馈修改</span>
      </button>
      <button class="mode-card" type="button" data-mode="draftScript">
        <strong>视频初稿</strong>
        <span>是否按确认脚本拍摄</span>
      </button>
      <button class="mode-card" type="button" data-mode="revisionFeedback">
        <strong>视频修改稿</strong>
        <span>是否解决客户意见</span>
      </button>
      <button class="mode-card" type="button" data-mode="captionBrief">
        <strong>Caption</strong>
        <span>是否符合发布要求</span>
      </button>
    </section>

    <section class="layout">
      <section class="workbench">
        <article class="brief-card">
          <div class="section-head">
            <div>
              <h2>Brief</h2>
              <p>客户 brief、caption 要求、必提卖点、禁用词都放这里。</p>
            </div>
            <label class="file-button">
              上传文件
              <input id="briefFile" type="file" accept=".txt,.md,.csv,.json,.srt,.vtt">
            </label>
          </div>
          <textarea id="briefText" placeholder="粘贴 brief，或上传 txt / md / csv / srt / vtt 文件..."></textarea>
          <p id="fileStatus" class="file-status"></p>
        </article>

        <div class="rounds-head">
          <div>
            <h2>脚本轮次</h2>
            <p>默认是“脚本初稿 + 一轮脚本反馈 + 脚本二稿”，也可以继续添加多轮。</p>
          </div>
          <button id="addRoundBtn" type="button">添加一轮</button>
        </div>

        <div id="rounds" class="rounds"></div>

        <div class="audit-actions">
          <button id="auditBtn" class="primary" type="button">开始审核</button>
          <button id="copyBtn" type="button">复制审核结论</button>
        </div>
      </section>

      <aside class="results">
        <div class="score-card">
          <div>
            <p class="kicker">审核结论</p>
            <h2 id="verdict">待审核</h2>
          </div>
          <div class="score-ring" id="scoreRing">--</div>
        </div>

        <div id="summary" class="summary">
          录入资料后点击“开始审核”，这里会显示覆盖率、缺失要点、疑似未修改项和建议反馈话术。
        </div>

        <div class="result-block">
          <h3>逐项检查</h3>
          <div id="checks" class="checks"></div>
        </div>

        <div class="result-block">
          <h3>可复制反馈</h3>
          <textarea id="feedbackOutput" readonly placeholder="审核后自动生成给博主/客户的反馈文案"></textarea>
        </div>
      </aside>
    </section>
  </main>
  <script src="./app.js"></script>
</body>
</html>
