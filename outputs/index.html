<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KOL内容审核助手</title>
  <link rel="stylesheet" href="./styles.css?v=video-sources">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <p class="kicker">KOL REVIEW DESK</p>
        <h1>KOL内容审核助手</h1>
      </div>
      <div class="top-actions">
        <button id="sampleBtn" type="button">载入示例</button>
        <button id="exportBtn" type="button">复制审核表</button>
      </div>
    </header>

    <section class="shell">
      <aside class="sidebar">
        <nav class="side-nav" aria-label="主导航">
          <button class="side-tab active" data-view="overview" type="button"><span class="nav-mark">O</span>Project Overview</button>
        </nav>
        <div class="side-head"><h2>Projects</h2><button id="addProjectBtn" class="compact-action" type="button">New</button></div>
        <nav id="campaignTree" class="campaign-tree" aria-label="Campaign navigation"></nav>
      </aside>

      <section class="workspace">
        <section id="overviewView" class="overview-view"></section>

        <section id="projectView" class="project-view hidden">
          <section id="progressPanel" class="progress-panel"></section>
          <div class="review-workspace">
            <div class="review-inputs">
              <nav class="workflow-stepper" aria-label="工作区">
                <button class="section-tab active" data-section="brief" type="button">Brief</button>
                <button class="section-tab" data-section="script" type="button">Script</button>
                <button class="section-tab" data-section="draft" type="button">Draft</button>
                <button class="section-tab" data-section="post" type="button">Post</button>
              </nav>
              <section id="briefSection" class="section-card"></section>
              <section id="scriptSection" class="section-card hidden"></section>
              <section id="draftSection" class="section-card hidden"></section>
              <section id="postSection" class="section-card hidden"></section>
              <div class="audit-actions">
                <button id="auditBtn" class="primary" type="button">审核本阶段</button>
                <button id="clearCreatorBtn" type="button">清空当前博主</button>
              </div>
            </div>

            <aside class="results">
              <div class="result-top">
                <div><p class="kicker">修改落实情况</p><h2 id="verdict">待审核</h2></div>
                <div class="score-ring" id="scoreRing">--</div>
              </div>
              <div class="summary-grid">
                <div><span>已落实</span><strong id="doneCount">0</strong></div>
                <div><span>待确认</span><strong id="maybeCount">0</strong></div>
                <div><span>未落实</span><strong id="missingCount">0</strong></div>
              </div>
              <p id="summary" class="summary">选择博主与阶段后开始审核。</p>
              <div id="reviewChecklist" class="review-checklist"></div>
              <div class="result-controls">
                <button class="filter-btn active" data-filter="all" type="button">全部</button>
                <button class="filter-btn" data-filter="done" type="button">已落实</button>
                <button class="filter-btn" data-filter="maybe" type="button">待确认</button>
                <button class="filter-btn" data-filter="missing" type="button">未落实</button>
              </div>
              <div id="auditTable" class="audit-table"></div>
            </aside>
          </div>
        </section>
      </section>
    </section>
  </main>
  <script src="./app.js?v=video-sources"></script>
</body>
</html>
