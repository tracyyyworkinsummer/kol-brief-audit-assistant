<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KOL Brief 审核助手</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <p class="kicker">KOL REVIEW DESK</p>
        <h1>KOL Brief 审核助手</h1>
      </div>
      <div class="top-actions">
        <button id="sampleBtn" type="button">载入示例</button>
        <button id="exportBtn" type="button">复制审核表</button>
      </div>
    </header>

    <section class="shell">
      <aside class="project-panel">
        <div class="panel-head">
          <div>
            <h2>项目</h2>
            <p>同一项目共享一份 Brief。</p>
          </div>
          <button id="addProjectBtn" type="button">新增</button>
        </div>
        <div id="projectList" class="stack"></div>

        <div class="panel-head creator-head">
          <div>
            <h2>博主</h2>
            <p>同项目下可管理多位博主。</p>
          </div>
          <button id="addCreatorBtn" type="button">新增</button>
        </div>
        <div id="creatorList" class="stack"></div>
      </aside>

      <section class="workspace">
        <nav class="section-tabs" aria-label="工作区">
          <button class="section-tab active" data-section="brief" type="button">Brief</button>
          <button class="section-tab" data-section="script" type="button">Script</button>
          <button class="section-tab" data-section="draft" type="button">Draft</button>
          <button class="section-tab" data-section="post" type="button">Post</button>
        </nav>

        <section id="briefSection" class="section-card"></section>
        <section id="scriptSection" class="section-card hidden"></section>
        <section id="draftSection" class="section-card hidden"></section>
        <section id="postSection" class="section-card hidden"></section>

        <div class="audit-actions">
          <button id="auditBtn" class="primary" type="button">生成审核</button>
          <button id="clearCreatorBtn" type="button">清空当前博主</button>
        </div>
      </section>

      <aside class="results">
        <div class="score-card">
          <div>
            <p class="kicker">审核结论</p>
            <h2 id="verdict">待审核</h2>
          </div>
          <div class="score-ring" id="scoreRing">--</div>
        </div>

        <div id="summary" class="summary">
          点击“生成审核”后，这里会按“客户要求 / 博主是否完成 / 评价”输出审核表。
        </div>

        <div class="result-controls">
          <button class="filter-btn active" data-filter="all" type="button">全部</button>
          <button class="filter-btn" data-filter="done" type="button">已完成</button>
          <button class="filter-btn" data-filter="maybe" type="button">疑似缺失</button>
          <button class="filter-btn" data-filter="missing" type="button">未修改</button>
        </div>

        <div id="auditTable" class="audit-table"></div>
      </aside>
    </section>
  </main>
  <script src="./app.js"></script>
</body>
</html>
